name: Examples (e2e)

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      huml_version:
        description: 'Published Huml.Net version to test (blank = the default in Directory.Build.props)'
        required: false
        default: ''
      pack_from_source:
        description: 'Pack the packages from the main repo''s current main instead of using nuget.org'
        required: false
        type: boolean
        default: false

jobs:
  run-examples:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout examples
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1  # v5.4.0
        with:
          dotnet-version: '10.0.x'

      # nuget.config declares a 'local-feed' source; NuGet fails restore (NU1301) if the
      # directory is missing, so create it even when restoring from nuget.org.
      - name: Ensure local-feed exists
        run: mkdir -p local-feed

      # Pack-from-source mode (manual dispatch only): test against the main repo's current
      # main BEFORE a version is published. Packs as 0.0.0-source so restore can never
      # silently resolve a same-versioned package from nuget.org instead of the local feed.
      - name: Checkout Huml.Net (pack-from-source mode)
        if: ${{ inputs.pack_from_source }}
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          repository: primeBeri/huml-dotnet
          path: huml-dotnet

      - name: Pack main repo into local-feed (pack-from-source mode)
        if: ${{ inputs.pack_from_source }}
        run: |
          dotnet pack huml-dotnet/src/Huml.Net/Huml.Net.csproj -c Release \
            -p:Version=0.0.0-source -p:MinVerVersionOverride=0.0.0-source -o local-feed
          dotnet pack huml-dotnet/src/Huml.Net.SourceGeneration/Huml.Net.SourceGeneration.csproj -c Release \
            -p:Version=0.0.0-source -p:MinVerVersionOverride=0.0.0-source -o local-feed

      - name: Run all examples against the package
        run: |
          if [ "${{ inputs.pack_from_source }}" = "true" ]; then
            pwsh ./run-examples.ps1 -HumlNetVersion 0.0.0-source
          elif [ -n "${{ inputs.huml_version }}" ]; then
            pwsh ./run-examples.ps1 -HumlNetVersion "${{ inputs.huml_version }}"
          else
            pwsh ./run-examples.ps1
          fi
